<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tsurara Idea Lab</title>
  <meta name="description" content="AI生成に使いやすいプロンプトと創作アイデアを整理したプロンプトライブラリです。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="language-switch" id="languageSwitch" aria-label="Language switch">
        <button class="language-switch-button" type="button" data-lang="ja">JP</button>
        <button class="language-switch-button" type="button" data-lang="en">EN</button>
      </div>

      <div class="header-copy">
        <h1>Tsurara Idea Lab</h1>
        <p class="lead" data-i18n="lead">AI生成に使いやすいプロンプトと創作アイデアを、ファッション・構図背景・季節イベントに整理したサイトです。気になる記事から日本語版 / 英語版プロンプトをすぐにコピーできます。</p>

        <div class="hero-links" aria-label="関連リンク">
          <button class="hero-link-card hero-guide-card guide-card-link" id="guideButton" type="button">
            <img class="hero-link-icon optional-image" src="images/banners/guide.png" alt="" loading="lazy">
            <span class="hero-link-label">Guide</span>
            <strong data-i18n="guideTitle">活用ガイド</strong>
            <span data-i18n="guideDesc">プロンプトの使い方と楽しみ方</span>
          </button>
          <a class="hero-link-card community-card-link" id="community" href="https://discord.gg/sora2jp" target="_blank" rel="noopener">
            <img class="hero-link-icon optional-image" src="images/banners/community.png" alt="" loading="lazy">
            <span class="hero-link-label">Community</span>
            <strong data-i18n="communityTitle">動画生成AI研究＆交流コミュニティ</strong>
            <span data-i18n="communityDesc">AI生成の仲間が欲しい方におすすめ</span>
          </a>
          <a class="hero-link-card tarot-card-link" href="https://tsuraravvv-arch.github.io/tarot/" target="_blank" rel="noopener">
            <img class="hero-link-icon optional-image" src="images/banners/tarot.png" alt="" loading="lazy">
            <span class="hero-link-label">Tarot</span>
            <strong data-i18n="tarotTitle">氷洞つららの大アルカナ占い</strong>
            <span data-i18n="tarotDesc">わたしが作成したタロットカード占いです</span>
          </a>
        </div>
      </div>

      <img class="hero-image optional-image" src="images/banners/hero.png" alt="Tsurara Idea Lab メインビジュアル" />
    </div>
  </header>

  <main>
    <section class="library-nav" aria-label="プロンプト分類">
      <button class="library-tile is-active" data-filter="DEFAULT" type="button">
        <span>✦</span><strong data-i18n="filterDefault">新着＋おすすめ</strong>
      </button>
      <button class="library-tile" data-filter="ALL" type="button">
        <span>▦</span><strong data-i18n="filterAll">すべて</strong>
      </button>
      <button class="library-tile" data-filter="ORIGINAL" type="button">
        <span>✎</span><strong data-i18n="filterOriginal">オリジナル</strong>
      </button>
      <button class="library-tile" data-filter="JOB" type="button">
        <span>JOB</span><strong data-i18n="filterJob">職業</strong>
      </button>
<button class="library-tile" data-filter="ORI" type="button">
        <span>JOB</span><strong data-i18n="filterJob">オリジナル</strong>
      </button>
